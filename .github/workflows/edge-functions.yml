# Edge Function CI/CD.
#
# On every PR:    runs `deno test` on every supabase/functions/* pin
#                 test so server-side math regressions can't slip in
#                 unnoticed.
# On push to main: same tests, then deploys every changed function
#                 with the Supabase CLI. Requires repo secrets:
#                   - SUPABASE_ACCESS_TOKEN  (account-level PAT)
#                   - SUPABASE_PROJECT_REF   (project's ref id)
# A push that doesn't touch supabase/functions/** still runs the
# tests (it's cheap and guards against test files being changed
# without an accompanying function update) but skips the deploy step
# entirely.

name: edge-functions

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions.yml'

# Cancel any in-flight run for the same branch when a new push lands —
# otherwise two rapid pushes both fire `supabase functions deploy` and
# the later one might land BEFORE the earlier one finishes uploading,
# leaving production on whichever upload finished last (not the latest
# commit). With cancel-in-progress the older run dies before its deploy
# step runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token by default. The deploy step's `environment:`
# elevates secrets exposure on push-to-main only, scoped to the
# `production` GitHub Environment that holds SUPABASE_ACCESS_TOKEN
# + SUPABASE_PROJECT_REF.
permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    # Gate the whole job on the `production` GitHub Environment when
    # this is a push-to-main run. Required-reviewers / wait-timer /
    # secret rotation all live on the Environment in GitHub Settings.
    # Set up: Settings → Environments → New environment "production",
    # move SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF from repo
    # secrets into it. The job is unaffected for PR runs (the
    # condition only matches push-to-main).
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'production' || '' }}
    steps:
      # Actions SHA-pinned (mutable tags can be silently re-pointed by
      # a compromised maintainer to run arbitrary code against the
      # SUPABASE_ACCESS_TOKEN). Dependabot bumps them on real releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `git diff $before..$after` in the detect step
          # below can resolve the push base (the default shallow clone
          # is depth=1, which would error out on any push of more than
          # one commit).
          fetch-depth: 0

      - name: Install Deno
        # Action wrapper bumped to v2 (Node-24-compatible runner).
        # `deno-version: v1.x` keeps the actual Deno runtime on 1.x
        # to match Supabase's Edge Runtime, which is still Deno-1
        # based — running tests on Deno 2 in CI but Deno 1 in
        # production could surface subtle stdlib drift.
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v1.x

      - name: Deno typecheck (full TS pass over all Edge Functions)
        # `deno test --no-check` (the next step) disables the TS pass
        # globally so the runtime tests start faster. That meant a TS
        # error in `_yahoo.ts` would only surface at production
        # runtime — `deno check` here catches them at CI time.
        # --quiet so the per-module type emit doesn't drown the log;
        # we want a clean pass or a clean failure, nothing in between.
        run: deno check --quiet supabase/functions/

      - name: Deno test (pure-helper pins for every Edge Function)
        # --allow-env is required because each function reads
        # Deno.env.get(...) at module-init time (the result is an
        # empty string when the secret isn't set, which is fine for
        # the pure helpers being tested).
        # --no-check here is intentional after the dedicated typecheck
        # step above — it makes the test pass faster without losing
        # the TS-error-blocks-CI guarantee.
        run: deno test --allow-env --no-check supabase/functions/

      - name: Install Supabase CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Detect changed functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: changed
        env:
          # Diff the entire push, not just the tip commit — otherwise a
          # push of multiple commits where only the LAST one doesn't
          # touch `<fn>/index.ts` would silently skip deploying earlier
          # changes (CI green, production stuck on the old version).
          # `github.event.before` is the prior tip; `00..0` is GitHub's
          # sentinel for "branch creation, no prior commit".
          BEFORE: ${{ github.event.before }}
          AFTER:  ${{ github.sha }}
        run: |
          # `_`-prefixed entries (e.g. `_shared/`) are NOT functions — they
          # hold modules sibling functions import, so they must never be
          # passed to `supabase functions deploy`.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous tip (branch creation) — deploying every function."
            CHANGED=$(ls supabase/functions/ | grep -v '^_')
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -q '^supabase/functions/_'; then
            # A shared module under `supabase/functions/_shared/` changed.
            # Every function bundles its imports at deploy time, so the
            # per-index.ts diff below would MISS the consumers and ship a
            # stale shared helper. Redeploy all functions to be safe.
            # (Matches only the top-level `_shared/`, not a function's own
            # `_`-files like fundamentals/_yahoo.ts.)
            echo "Shared module changed — deploying every function."
            CHANGED=$(ls supabase/functions/ | grep -v '^_')
          else
            # `|| true` so a push that touches supabase/functions/** WITHOUT
            # changing any index.ts (e.g. a test-only edit) doesn't trip
            # bash's pipefail when grep finds no matches.
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" \
              | { grep '^supabase/functions/[^/]*/index\.ts$' || true; } \
              | awk -F/ '{print $3}' \
              | sort -u)
          fi
          if [ -z "$CHANGED" ]; then
            echo "No Edge Function index.ts changes; nothing to deploy."
            echo "functions=" >> "$GITHUB_OUTPUT"
          else
            echo "Changed Edge Functions: $CHANGED"
            # Join with spaces for the next step.
            FUNCS=$(echo "$CHANGED" | tr '\n' ' ' | sed 's/ *$//')
            echo "functions=$FUNCS" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy changed Edge Functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changed.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Supabase secrets missing — set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in repo secrets to enable auto-deploy. Skipping."
            exit 0
          fi
          # Per-function deploy flags. Anon-callable functions
          # (auth — needs to receive the password challenge before any
          # token exists; data / trading212 / ops-error — gated by
          # their own HMAC x-app-token inside the function body;
          # overnight-record — cron-triggered, gated by its own
          # `Authorization: Bearer <CRON_SECRET>` check, and CRON_SECRET
          # is NOT a Supabase JWT so the platform's verify_jwt would
          # 401 the cron call before our gate runs) get --no-verify-jwt
          # so the Supabase platform doesn't reject the call first. The
          # rest (prices / chart / fundamentals / overnight-fetch) keep
          # Supabase's JWT check on — the client sends a valid anon
          # Bearer, and leaving it on stops unauthenticated visitors
          # using them as a free upstream proxy (burning rate quotas).
          PUBLIC_FNS="auth data trading212 ops-error overnight-record"
          for fn in ${{ steps.changed.outputs.functions }}; do
            FLAGS="--project-ref $SUPABASE_PROJECT_REF"
            case " $PUBLIC_FNS " in
              *" $fn "*) FLAGS="$FLAGS --no-verify-jwt" ;;
            esac
            echo "::group::Deploying $fn ($FLAGS)"
            supabase functions deploy "$fn" $FLAGS
            echo "::endgroup::"
          done

  # Separate job purely so `issues: write` doesn't widen the deploy
  # job's scope. Runs only on push-to-main failures.
  notify-failure:
    needs: test-and-deploy
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open / bump CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          existing=$(gh issue list --repo "${{ github.repository }}" \
            --label ci-failure --state open --limit 1 --json number \
            --jq '.[0].number')
          body="❌ \`${{ github.workflow }}\` failed on \`main\` at commit \`${{ github.sha }}\`
          [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "❌ ${{ github.workflow }} failed on main" \
              --body "$body" \
              --label ci-failure
          fi
