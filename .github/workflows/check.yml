# Catches type errors and broken builds before the committed bundle is
# published. Cloudflare Pages may still Git-build on watch paths `dist/*`;
# pages-deploy.yml Direct-Uploads the same committed dist/ via Wrangler
# so a Pages builder does not have to clone the repository.
# Runs on every PR and every push to main.
#
# Its gates run as several jobs at once (Davies, 2026-10-02: "ci为什么跑的这么
# 慢 有可以优化和并行跑的吗"). Until then one job ran every gate in turn: 6 min
# 08 s on 13cfa152, of which the browser sweep was 235 s in one process and
# the perf matrix and the size budget 49 s more, though no gate reads
# another's result. Now the source checks, the sweep's four shards and the
# bundle's two other checks each take a runner, and the repository is
# public, so the runners' minutes cost nothing.
#
# The bundle they check is the COMMITTED dist/, the one Cloudflare serves
# (review F7, 2026-10-08). Until then each bundle job built its own and
# tested that, and the freshness gate only asked that a push touching src/
# touch dist/ too, so a batch whose last commit changed src/ alone shipped
# the bundle of the commit before it while CI tested a fresh build. The
# build is deterministic now (vite.config.js: the stamp comes from the
# source, not the clock), so the source-check job builds the commit and
# requires the result to be the committed dist/ byte for byte, and the
# sweep, the perf matrix and the size budget read dist/ as checked out.
# pages-deploy.yml publishes only once this workflow has passed.

name: check

on:
  pull_request:
  push:
    branches: [main]

# Cancel any in-flight run for the same branch when a new push lands.
# Without this, two rapid pushes on main both kick off jobs and which
# one wins (writes the latest status / triggers downstream deploys) is
# whichever finishes last — not always the latest commit. The new
# rule means the older job is killed mid-flight; the latest push is
# always the canonical state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Lock the GITHUB_TOKEN down to read-only. Defaults to repo's "Read
# and write permissions" on public repos, which gives the workflow
# more than it needs (this one just typechecks / tests / builds; no
# commit, no comment, no release). Explicit `contents: read` is the
# safest baseline; jobs that need to write can override locally.
permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    # The web app is an npm project in src/ (package.json, lockfile,
    # tsconfig and the Vite, ESLint and knip settings), so every `run`
    # starts there. The bundle it builds is still the repository's dist/.
    defaults:
      run:
        working-directory: src
    steps:
      # Actions pinned by full commit SHA (with the release tag as a
      # comment) — mutable `@v5` tags can be silently re-pointed by a
      # compromised maintainer to run arbitrary code against the
      # workflow's secrets. Dependabot bumps these on real releases.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - run: npm ci

      - name: Type check (tsc --noEmit on JS/JSX with checkJs)
        run: npm run typecheck

      - name: Lint (ESLint — react-hooks bug rules)
        # Gates on errors only — chiefly react-hooks/rules-of-hooks, the
        # hook-ordering class that shipped the React-#310 crash once.
        # exhaustive-deps is a non-blocking warning: a handful of effects
        # intentionally narrow their dep set (documented inline).
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (Vite production bundle)
        run: npm run build

      - name: Bundle freshness — the committed dist/ is this commit's build, byte for byte
        # The bundle is committed and published as-is (no build at deploy), so
        # a src/ change without its rebuilt dist/ ships stale code while CI
        # passes. With a deterministic build the check is the real one: the
        # build just made must leave dist/ exactly as committed — nothing
        # changed, removed or added (source maps aside: they are ignored and
        # never committed). It replaces a check that only asked whether the
        # push touched dist/ at all (review F7).
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is not the build of this commit's source. Run 'npm run build' in src/ and commit dist/ with the change."
            git status --short -- dist | head -40
            exit 1
          fi
          echo "Bundle freshness OK: the build reproduced the committed dist/."

      - name: Dead-code / unused-export scan
        # knip surfaces exports that no one imports, unused files +
        # unused devDependencies. Now a HARD gate (was informational):
        # the `utils.js` barrel that produced the old false positives
        # was retired in favour of direct per-module imports, and
        # `ignoreExportsUsedInFile` in src/package.json's `knip` block covers the legitimate
        # internal-only / test-hook exports — so the report is clean and
        # a newly-orphaned export or dead file goes red instead of
        # silently accumulating. If a finding is a genuine false
        # positive, tighten the `knip` block rather than re-adding
        # continue-on-error. Two runs: knip reads only code under the
        # folder that holds its package.json, so the web app is checked
        # here in src/ and the Edge Functions by bin/knip-edge.sh, against
        # supabase/knip.json.
        run: |
          npx --no-install knip
          sh ../bin/knip-edge.sh

      - name: Dependency audit (high-severity only)
        # Surfaces supply-chain vulnerabilities. `--audit-level=high`
        # so a transitive moderate doesn't gate every push; bump to
        # `moderate` when the dep tree is clean enough that it's
        # signal not noise. `--omit=dev` excludes vitest / vite /
        # plugins from the audit — those don't ship to users so a
        # vulnerability there doesn't affect the deployed site.
        run: npm audit --audit-level=high --omit=dev

      - name: Dependency audit (full tree, informational)
        # The gate above omits devDependencies, but the build/test
        # toolchain (vite, vitest, eslint, …) executes in CI WITH repo
        # secrets in scope, so a compromised build-time transitive is a
        # real supply-chain risk. This second pass scans the whole tree
        # at `critical` and is non-blocking (continue-on-error) — it
        # surfaces toolchain CVEs without gating every push on a moderate
        # in a dev-only dep.
        continue-on-error: true
        run: npm audit --audit-level=critical

  # The browser sweep in four shards, each on a runner of its own: one
  # viewport, and either `main` (sections 1–8, which share one page) or every
  # other part (`SWEEP_PART=-main`, so a part added later runs without a
  # change here), as bin/gates.sh splits it. No check compares two shards,
  # and together they are the whole sweep. fail-fast is off, so one failing
  # shard does not cancel what the others would have found.
  sweep:
    name: sweep (${{ matrix.viewport }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, phone]
        shard: [main, rest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - run: npm ci

      - name: Install Chromium for the browser sweep
        # Browsers only, no system deps: ubuntu-latest already carries
        # what headless Chromium needs, and `--with-deps` costs a sudo
        # apt install on every run.
        run: npx --no-install playwright install chromium

      - name: Browser sweep (the committed bundle, driven in a real browser)
        # Promoted from a by-hand script in `scraps/` to a gate. Every
        # bug it has caught — the scoreboard/heat-map mismatch, the
        # missing preflight header, the overnight sawtooth, the heat-map
        # em dash — was live while the unit and Edge suites were green,
        # because each was an integration failure. It serves the
        # COMMITTED bundle over http and drives it at its shard's breakpoint.
        #
        # It can only gate because its clock is pinned: the app reads
        # the real clock to decide whether an after-hours print can
        # exist, so before pinning this suite passed only between 20:00
        # and 24:00 UTC and was red the rest of the day. See the CLOCK
        # constant in the sweep.
        env:
          SWEEP_VIEWPORT: ${{ matrix.viewport }}
          SWEEP_PART: ${{ matrix.shard == 'main' && 'main' || '-main' }}
        run: npm run verify:browser

  # The bundle's two other checks: the perf matrix, and the size budget,
  # whose time plugin runs the bundle in a headless Chrome (16 s of it).
  perf-and-size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - run: npm ci

      - name: Install Chromium for the perf matrix
        # Browsers only, no system deps: ubuntu-latest already carries
        # what headless Chromium needs, and `--with-deps` costs a sudo
        # apt install on every run.
        run: npx --no-install playwright install chromium

      - name: Performance panel matrix (the committed bundle, 60 cases)
        # Both performance views x five ranges x three recorded-data states
        # x two books (buys only; sold down), each read back from the page
        # and compared with an answer worked out by hand. It caught the
        # 24H reading +14.81 % where the book moved +16.00 % while the unit
        # tests agreed with themselves. By hand for months because it read
        # the real clock and failed 18 cases between 14:00 and 20:00 UTC:
        # its fixture's first bar falls out of the 24H window then, and the
        # app was right. Its clock is pinned now, and it refuses an instant
        # its fixture cannot serve.
        run: npm run verify:perf

      - name: Bundle size budget (gzipped main bundle)
        # Hard cap on `dist/assets/app-*.js` gzipped size — see the `size-limit` block in `src/package.json`
        # for the current limit. A PR that doubles the bundle (lazy chunks
        # added back to the main chunk, a heavy dep imported eagerly,
        # etc.) goes red instead of silently shipping. Bump the limit in
        # the same PR if the growth is intentional.
        run: npx --no-install size-limit

  # Separate job purely so it can carry `issues: write` without
  # widening the build job's permission scope. Runs only on push-to-
  # main failures — PR failures already have visible inline status.
  notify-failure:
    needs: [typecheck-and-build, sweep, perf-and-size]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open / bump CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Ensure the label exists (idempotent) before the first use ever
          # references it below — discovered via healthcheck.yml's own
          # identical bug (a `gh issue create --label <X>` with no prior
          # `gh label create` fails hard the first time X doesn't already
          # exist in the repo; `ci-failure` never has).
          gh label create ci-failure --repo "${{ github.repository }}" \
            --color B60205 --description "A push to main broke CI" \
            2>/dev/null || true
          # De-dup: if an open `ci-failure` issue already exists, add a
          # comment instead of stacking another issue per push.
          existing=$(gh issue list --repo "${{ github.repository }}" \
            --label ci-failure --state open --limit 1 --json number \
            --jq '.[0].number // empty')
          body="❌ \`${{ github.workflow }}\` failed on \`main\` at commit \`${{ github.sha }}\`
          [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "❌ ${{ github.workflow }} failed on main" \
              --body "$body" \
              --label ci-failure
          fi
