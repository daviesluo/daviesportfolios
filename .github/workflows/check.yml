# Catches type errors and broken builds before Cloudflare Pages tries to deploy
# them. Runs on every PR and every push to main.

name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Type check (tsc --noEmit on JS/JSX with checkJs)
        run: npm run typecheck

      - name: Build (Vite production bundle)
        run: npm run build
