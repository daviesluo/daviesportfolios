# Catches type errors and broken builds before Cloudflare Pages tries to deploy
# them. Runs on every PR and every push to main.

name: check

on:
  pull_request:
  push:
    branches: [main]

# Cancel any in-flight run for the same branch when a new push lands.
# Without this, two rapid pushes on main both kick off jobs and which
# one wins (writes the latest status / triggers downstream deploys) is
# whichever finishes last — not always the latest commit. The new
# rule means the older job is killed mid-flight; the latest push is
# always the canonical state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Lock the GITHUB_TOKEN down to read-only. Defaults to repo's "Read
# and write permissions" on public repos, which gives the workflow
# more than it needs (this one just typechecks / tests / builds; no
# commit, no comment, no release). Explicit `contents: read` is the
# safest baseline; jobs that need to write can override locally.
permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by full commit SHA (with the release tag as a
      # comment) — mutable `@v5` tags can be silently re-pointed by a
      # compromised maintainer to run arbitrary code against the
      # workflow's secrets. Dependabot bumps these on real releases.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Type check (tsc --noEmit on JS/JSX with checkJs)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (Vite production bundle)
        run: npm run build

      - name: Dependency audit (high-severity only)
        # Surfaces supply-chain vulnerabilities. `--audit-level=high`
        # so a transitive moderate doesn't gate every push; bump to
        # `moderate` when the dep tree is clean enough that it's
        # signal not noise. `--omit=dev` excludes vitest / vite /
        # plugins from the audit — those don't ship to users so a
        # vulnerability there doesn't affect the deployed site.
        run: npm audit --audit-level=high --omit=dev
