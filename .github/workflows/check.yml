# Catches type errors and broken builds before Cloudflare Pages tries to deploy
# them. Runs on every PR and every push to main.

name: check

on:
  pull_request:
  push:
    branches: [main]

# Cancel any in-flight run for the same branch when a new push lands.
# Without this, two rapid pushes on main both kick off jobs and which
# one wins (writes the latest status / triggers downstream deploys) is
# whichever finishes last — not always the latest commit. The new
# rule means the older job is killed mid-flight; the latest push is
# always the canonical state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Lock the GITHUB_TOKEN down to read-only. Defaults to repo's "Read
# and write permissions" on public repos, which gives the workflow
# more than it needs (this one just typechecks / tests / builds; no
# commit, no comment, no release). Explicit `contents: read` is the
# safest baseline; jobs that need to write can override locally.
permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by full commit SHA (with the release tag as a
      # comment) — mutable `@v5` tags can be silently re-pointed by a
      # compromised maintainer to run arbitrary code against the
      # workflow's secrets. Dependabot bumps these on real releases.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so the bundle-freshness diff (below) can reach the
          # PR's merge-base / the push's previous tip.
          fetch-depth: 0

      - name: Bundle freshness — src changes must rebuild the committed bundle
        # The built bundle (dist/) is committed and published as-is by
        # Cloudflare (no CF build step), so a change that
        # edits src/ but forgets `npm run build` + commit ships STALE JS
        # while CI stays green — the single biggest fragility in the
        # commit-the-bundle model. This catches it: if the PR/push changed
        # any non-test src file but touched none of the committed bundle,
        # fail. (Comment-only src edits trip it too — intentional: the
        # repo's convention is to rebuild on every src change so the
        # committed bundle is never behind, and the CalVer stamp makes a
        # content-equality check impossible anyway.)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          else
            echo "No diff base (branch creation) — skipping."; exit 0
          fi
          CHANGED=$(git diff --name-only $RANGE)
          SRC=$(echo "$CHANGED" | { grep -E '^src/.*\.(js|jsx|css)$' || true; } | { grep -v '\.test\.' || true; })
          BUNDLE=$(echo "$CHANGED" | { grep -E '^dist/' || true; })
          if [ -n "$SRC" ] && [ -z "$BUNDLE" ]; then
            echo "::error::src/ changed but the committed bundle was not rebuilt. Run 'npm run build' and commit dist/."
            echo "Changed source files without a bundle rebuild:"; echo "$SRC"
            exit 1
          fi
          echo "Bundle freshness OK."

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Type check (tsc --noEmit on JS/JSX with checkJs)
        run: npm run typecheck

      - name: Lint (ESLint — react-hooks bug rules)
        # Gates on errors only — chiefly react-hooks/rules-of-hooks, the
        # hook-ordering class that shipped the React-#310 crash once.
        # exhaustive-deps is a non-blocking warning: a handful of effects
        # intentionally narrow their dep set (documented inline).
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (Vite production bundle)
        run: npm run build

      - name: Install Chromium for the browser sweep
        # Browsers only, no system deps: ubuntu-latest already carries
        # what headless Chromium needs, and `--with-deps` costs a sudo
        # apt install on every run.
        run: npx --no-install playwright install chromium

      - name: Browser sweep (the built bundle, driven in a real browser)
        # Promoted from a by-hand script in `scraps/` to a gate. Every
        # bug it has caught — the scoreboard/heat-map mismatch, the
        # missing preflight header, the overnight sawtooth, the heat-map
        # em dash — was live while the unit and Edge suites were green,
        # because each was an integration failure. It serves the
        # COMMITTED bundle over http and drives it at both breakpoints.
        #
        # It can only gate because its clock is pinned: the app reads
        # the real clock to decide whether an after-hours print can
        # exist, so before pinning this suite passed only between 20:00
        # and 24:00 UTC and was red the rest of the day. See the CLOCK
        # constant in the sweep.
        run: npm run verify:browser

      - name: Bundle size budget (gzipped main bundle)
        # Hard cap on `dist/assets/app-*.js` gzipped size — see `.size-limit.json`
        # for the current limit. A PR that doubles the bundle (lazy chunks
        # added back to the main chunk, a heavy dep imported eagerly,
        # etc.) goes red instead of silently shipping. Bump the limit in
        # the same PR if the growth is intentional.
        run: npx --no-install size-limit

      - name: Dead-code / unused-export scan
        # knip surfaces exports that no one imports, unused files +
        # unused devDependencies. Now a HARD gate (was informational):
        # the `utils.js` barrel that produced the old false positives
        # was retired in favour of direct per-module imports, and
        # `ignoreExportsUsedInFile` in knip.json covers the legitimate
        # internal-only / test-hook exports — so the report is clean and
        # a newly-orphaned export or dead file goes red instead of
        # silently accumulating. If a finding is a genuine false
        # positive, tighten knip.json rather than re-adding
        # continue-on-error.
        run: npx --no-install knip

      - name: Dependency audit (high-severity only)
        # Surfaces supply-chain vulnerabilities. `--audit-level=high`
        # so a transitive moderate doesn't gate every push; bump to
        # `moderate` when the dep tree is clean enough that it's
        # signal not noise. `--omit=dev` excludes vitest / vite /
        # plugins from the audit — those don't ship to users so a
        # vulnerability there doesn't affect the deployed site.
        run: npm audit --audit-level=high --omit=dev

      - name: Dependency audit (full tree, informational)
        # The gate above omits devDependencies, but the build/test
        # toolchain (vite, vitest, eslint, …) executes in CI WITH repo
        # secrets in scope, so a compromised build-time transitive is a
        # real supply-chain risk. This second pass scans the whole tree
        # at `critical` and is non-blocking (continue-on-error) — it
        # surfaces toolchain CVEs without gating every push on a moderate
        # in a dev-only dep.
        continue-on-error: true
        run: npm audit --audit-level=critical

  # Separate job purely so it can carry `issues: write` without
  # widening the build job's permission scope. Runs only on push-to-
  # main failures — PR failures already have visible inline status.
  notify-failure:
    needs: typecheck-and-build
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open / bump CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Ensure the label exists (idempotent) before the first use ever
          # references it below — discovered via healthcheck.yml's own
          # identical bug (a `gh issue create --label <X>` with no prior
          # `gh label create` fails hard the first time X doesn't already
          # exist in the repo; `ci-failure` never has).
          gh label create ci-failure --repo "${{ github.repository }}" \
            --color B60205 --description "A push to main broke CI" \
            2>/dev/null || true
          # De-dup: if an open `ci-failure` issue already exists, add a
          # comment instead of stacking another issue per push.
          existing=$(gh issue list --repo "${{ github.repository }}" \
            --label ci-failure --state open --limit 1 --json number \
            --jq '.[0].number // empty')
          body="❌ \`${{ github.workflow }}\` failed on \`main\` at commit \`${{ github.sha }}\`
          [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "❌ ${{ github.workflow }} failed on main" \
              --body "$body" \
              --label ci-failure
          fi
