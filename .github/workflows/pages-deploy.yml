# Publish the committed dist/ to Cloudflare Pages via Wrangler Direct
# Upload. This is NOT Cloudflare's Git-connected builder: that path
# clones the whole repository (study data under docs/, full history)
# to publish one folder. It does not run npm: it uploads the committed
# folder, and only once check.yml has passed on the same commit (review
# F7, 2026-10-08) — that workflow builds the commit and requires the
# committed dist/ byte for byte, then tests that very bundle. Until then
# the two ran side by side, and run 37697762469 published dd2e979e while
# its check failed the bundle-freshness step.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare API token
#                          Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account id
# Do not commit either value. If either is unset the deploy step is
# skipped so a push to main stays green until they are added.
#
# The dashboard Git integration can keep Build watch paths Include
# `dist/*` (a non-site push then builds nothing there) or be
# disconnected later so the two do not both publish. This file does
# not change that setting.

name: pages-deploy

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'wrangler.jsonc'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch: {}

# Cancel any in-flight run for the same branch when a new push lands —
# otherwise two rapid dist/ pushes both upload and the later one might
# finish BEFORE the earlier one, leaving production on whichever upload
# finished last (not the latest commit).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only checkout. deployments: write is only for the GitHub
# Deployments record wrangler-action writes when gitHubToken is set
# (Cloudflare's Direct Upload example).
permissions:
  contents: read
  deployments: write
  # The wait step reads check.yml's runs of this commit.
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Most of it is waiting for check.yml (about five minutes; at most 40).
    timeout-minutes: 50
    steps:
      # Actions SHA-pinned (mutable tags can be silently re-pointed by
      # a compromised maintainer to run arbitrary code against the
      # Cloudflare token). Dependabot bumps them on real releases.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Shallow is enough: this job publishes dist/, it does not
          # diff history. No npm install, no Vite build.
          fetch-depth: 1

      - name: Require committed bundle
        run: test -f dist/index.html

      - name: Wait for check.yml on this commit
        # A push publishes only a commit check.yml passed. A check that
        # failed or was cancelled (a newer push) means this commit is not
        # published, said as a warning: check's own red run is the alarm.
        # A run by hand (workflow_dispatch) is the owner's call and does
        # not wait.
        id: checked
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 80); do
            run=$(gh api "repos/$REPO/actions/workflows/check.yml/runs?head_sha=$SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            case "$run" in
              "completed success") echo "check passed on $SHA"; echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0 ;;
              completed*) echo "::warning::check ended '${run#completed }' on $SHA, so it is not published."; echo "ok=0" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            sleep 30
          done
          echo "::error::check did not finish on $SHA within 40 minutes, so it is not published."
          exit 1

      - name: Check Cloudflare secrets
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID missing — set them as repository secrets (API token: Account → Cloudflare Pages → Edit). Skipping deploy."
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy committed dist/
        if: steps.creds.outputs.ready == '1' && (github.event_name != 'push' || steps.checked.outputs.ok == '1')
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No root lockfile (the Vite app lives in src/). Do not let
          # the action hunt for one.
          packageManager: npm
          # checkout leaves a detached HEAD, so name the branch
          # explicitly: `main` is this project's Pages production
          # branch; workflow_dispatch from another ref is a preview.
          command: pages deploy dist --project-name=daviesportfolios --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # Separate job so `issues: write` does not widen the deploy job.
  notify-failure:
    needs: deploy
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open / bump CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh label create ci-failure --repo "${{ github.repository }}" \
            --color B60205 --description "A push to main broke CI" \
            2>/dev/null || true
          existing=$(gh issue list --repo "${{ github.repository }}" \
            --label ci-failure --state open --limit 1 --json number \
            --jq '.[0].number // empty')
          body="❌ \`${{ github.workflow }}\` failed on \`main\` at commit \`${{ github.sha }}\`
          [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "❌ ${{ github.workflow }} failed on main" \
              --body "$body" \
              --label ci-failure
          fi
