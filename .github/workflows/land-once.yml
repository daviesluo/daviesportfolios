name: deploy-agents-once

# One-shot deploy of the agents Edge Function from main. The push that landed
# the source was made with the Actions token, which does not start
# edge-functions.yml. This uses the same CLI flags that workflow uses.
on:
  push:
    branches: [cursor/land-tree-d414]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.117.0

      - name: Deploy agents
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1ff12027f36d72b9434e3964e169d88f476fdded"
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "Supabase secrets are not available to this job."
            exit 1
          fi
          supabase functions deploy agents --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
