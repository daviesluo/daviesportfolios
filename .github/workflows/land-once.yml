name: land-once

# One-shot. Downloads a hash-pinned source patch, rebuilds the bundle, runs the
# same gates as CI, and fast-forwards main. The patch is not stored in the
# repository. This file stays on the side branch.
on:
  push:
    branches: [cursor/land-tree-d414]

permissions:
  contents: write

concurrency:
  group: land-once
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Apply the pinned source patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "31bc4fecf44e75ce8f7261774a664144df6fa40d"
          curl -fsSL -o /tmp/src.patch "https://tmpfiles.org/dl/1790365746.6d93935a0aa3e865/wzw9EChvU0cq/src.patch"
          echo "f49153e53deb86bbf378001779ce6d751b0bc39d5c06447cb0f0ea5385507c47  /tmp/src.patch" | sha256sum -c -
          git apply --index /tmp/src.patch

      - name: Install dependencies and Chromium
        working-directory: src
        run: |
          set -euo pipefail
          npm ci
          npx --no-install playwright install chromium

      - name: Run the CI gates
        run: sh bin/gates.sh --full

      - name: Commit the rebuilt bundle and fast-forward main
        run: |
          set -euo pipefail
          git config user.name daviesluo
          git config user.email daviesluo@gmail.com
          git add -A
          git status --short
          git commit -m "Keep the scoreboard inside its frame, show deployed capital, and name the worst case."
          git push origin HEAD:main
