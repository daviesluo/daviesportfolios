<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 762" width="920" height="762" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <!-- daviesportfolios architecture diagram. Copyright 2026 Davies Luo.
       MIT licensed, like the rest of this repository (see LICENSE). -->
  <rect width="920" height="762" fill="#ffffff"/>
  <defs>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/>
    </marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1baf7a"/>
    </marker>
    <marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- user -->
  <rect x="145" y="16" width="150" height="44" rx="22" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="220" y="44" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">user</text>
  <line x1="220" y1="60" x2="220" y2="92" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#agrey)"/>
  <text x="234" y="82" font-size="12.5" fill="#57606a">opens daviesluo.com; one password, then a signed token</text>

  <!-- browser -->
  <g>
    <rect x="20" y="96" width="400" height="132" rx="10" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="220" y="124" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0b3d7a">BROWSER</text>
    <text x="220" y="146" text-anchor="middle" font-size="13" fill="#0b3d7a">React 19 PWA, served by Cloudflare Pages</text>
    <text x="220" y="176" text-anchor="middle" font-size="12" fill="#1f2328">tactics board · heat map · charts · ledger · agents page</text>
    <text x="220" y="208" text-anchor="middle" font-size="11.5" fill="#57606a">paints from its own cache first, then refreshes</text>
  </g>

  <!-- outside services -->
  <g>
    <rect x="500" y="96" width="400" height="132" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <text x="700" y="124" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2328">OUTSIDE SERVICES</text>
    <text x="700" y="146" text-anchor="middle" font-size="13" fill="#57606a">market data, broker, exchanges, decision model</text>
    <text x="700" y="172" text-anchor="middle" font-size="12" fill="#1f2328">Yahoo Finance · Eastmoney · Finnhub · Alpha Vantage</text>
    <text x="700" y="190" text-anchor="middle" font-size="12" fill="#1f2328">Trading 212 · Revolut X · Binance · Kraken · TypeSafe Jev</text>
    <text x="700" y="214" text-anchor="middle" font-size="11.5" fill="#57606a">every key stays on the server</text>
  </g>

  <!-- request path: browser to edge functions -->
  <line x1="220" y1="228" x2="220" y2="302" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#ablue)"/>
  <text x="232" y="258" font-size="11.5" fill="#2a78d6">requests carry</text>
  <text x="232" y="274" font-size="11.5" fill="#2a78d6">the signed token</text>

  <!-- server calls out -->
  <line x1="420" y1="318" x2="498" y2="216" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#agrey)"/>
  <line x1="700" y1="304" x2="700" y2="230" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#agrey)"/>
  <text x="712" y="258" font-size="11.5" fill="#57606a">quotes, orders and fills,</text>
  <text x="712" y="274" font-size="11.5" fill="#57606a">the model's answers</text>

  <!-- edge functions -->
  <g>
    <rect x="20" y="304" width="400" height="160" rx="10" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="220" y="332" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0b3d7a">EDGE FUNCTIONS</text>
    <text x="220" y="354" text-anchor="middle" font-size="13" fill="#0b3d7a">Supabase, Deno</text>
    <text x="220" y="384" text-anchor="middle" font-size="12" fill="#1f2328">auth · data · prices · chart · fundamentals</text>
    <text x="220" y="402" text-anchor="middle" font-size="12" fill="#1f2328">trading212 · overnight-fetch · ops-error · agents</text>
    <text x="220" y="440" text-anchor="middle" font-size="11.5" fill="#57606a">hold every secret; data calls need the signed token</text>
  </g>

  <!-- scheduled jobs -->
  <g>
    <rect x="500" y="304" width="400" height="160" rx="10" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="700" y="332" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0b3d7a">SCHEDULED JOBS</text>
    <text x="700" y="354" text-anchor="middle" font-size="13" fill="#0b3d7a">pg_cron calls Edge Functions, no browser needed</text>
    <text x="700" y="384" text-anchor="middle" font-size="12" fill="#1f2328">snapshot-record: every price, every five minutes</text>
    <text x="700" y="402" text-anchor="middle" font-size="12" fill="#1f2328">overnight-record: US overnight quotes, every five minutes</text>
    <text x="700" y="420" text-anchor="middle" font-size="12" fill="#1f2328">agents tick: the trading loop, every minute</text>
    <text x="700" y="446" text-anchor="middle" font-size="11.5" fill="#57606a">paper first; a live order needs a recorded confirmation</text>
  </g>

  <!-- down to the store -->
  <line x1="220" y1="464" x2="220" y2="534" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#ablue)"/>
  <text x="232" y="504" font-size="11.5" fill="#2a78d6">reads and writes</text>
  <line x1="700" y1="464" x2="700" y2="534" stroke="#1baf7a" stroke-width="1.8" marker-end="url(#agreen)"/>
  <text x="712" y="504" font-size="11.5" fill="#1baf7a">records what it measured</text>

  <!-- the store -->
  <rect x="20" y="536" width="880" height="100" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="2"/>
  <text x="460" y="567" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1f2328">Postgres, the record that outlives every page and every tick</text>
  <text x="460" y="593" text-anchor="middle" font-size="13.5" fill="#1f2328">the portfolio · five-minute prices · overnight quotes · broker fills · error reports</text>
  <text x="460" y="617" text-anchor="middle" font-size="12" fill="#57606a">every agents decision, order and fill  ·  schema migrations applied by CI when they land on main</text>

  <!-- legend -->
  <rect x="20" y="654" width="880" height="92" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <line x1="42" y1="676" x2="86" y2="676" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#ablue)"/>
  <text x="98" y="680" font-size="12.5" fill="#1f2328">a request from the page, answered by an Edge Function once the signed token checks out</text>
  <line x1="42" y1="702" x2="86" y2="702" stroke="#1baf7a" stroke-width="1.8" marker-end="url(#agreen)"/>
  <text x="98" y="706" font-size="12.5" fill="#1f2328">a scheduled job writing down what it saw, whether or not anyone has the page open</text>
  <line x1="42" y1="728" x2="86" y2="728" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#agrey)"/>
  <text x="98" y="732" font-size="12.5" fill="#1f2328">a call to an outside service, made from the server so that no key ever reaches the browser</text>
</svg>
