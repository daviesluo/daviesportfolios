<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <!-- ledger protocol diagram. Copyright 2026 Zheng Luo (Davies Luo).
       Licensed under the Apache License 2.0, whose text is the
       LICENSE file shipped beside this file. -->
  <rect width="920" height="620" fill="#ffffff"/>
  <defs>
    <marker id="rdown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/>
    </marker>
    <marker id="rup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1baf7a"/>
    </marker>
    <marker id="rgrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- user -->
  <rect x="385" y="16" width="150" height="44" rx="22" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="460" y="44" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">user</text>
  <line x1="460" y1="60" x2="460" y2="92" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#rgrey)"/>
  <text x="460" y="110" text-anchor="middle" font-size="12.5" fill="#57606a">hands the task to whichever session is alive, and never carries its state by hand</text>

  <!-- time axis -->
  <line x1="30" y1="146" x2="890" y2="146" stroke="#d0d7de" stroke-width="1.4" marker-end="url(#rgrey)"/>
  <text x="30" y="138" font-size="12" fill="#57606a">time, and one session dies wherever it dies</text>

  <!-- sessions -->
  <g>
    <rect x="20" y="166" width="260" height="150" rx="10" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="150" y="194" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0b3d7a">SESSION 1</text>
    <text x="150" y="216" text-anchor="middle" font-size="13" fill="#0b3d7a">e.g. Claude Code</text>
    <text x="150" y="246" text-anchor="middle" font-size="12" fill="#1f2328">does the work</text>
    <text x="150" y="278" text-anchor="middle" font-size="11.5" fill="#b3261e">ends: usage limit</text>
    <text x="150" y="296" text-anchor="middle" font-size="11.5" fill="#57606a">cliff drill, then push</text>
  </g>
  <g>
    <rect x="330" y="166" width="260" height="150" rx="10" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="460" y="194" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0b3d7a">SESSION 2</text>
    <text x="460" y="216" text-anchor="middle" font-size="13" fill="#0b3d7a">e.g. Cursor</text>
    <text x="460" y="246" text-anchor="middle" font-size="12" fill="#1f2328">resumes and continues</text>
    <text x="460" y="278" text-anchor="middle" font-size="11.5" fill="#b3261e">ends: container reclaimed</text>
    <text x="460" y="296" text-anchor="middle" font-size="11.5" fill="#57606a">no warning, only the push survives</text>
  </g>
  <g>
    <rect x="640" y="166" width="260" height="150" rx="10" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="770" y="194" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0b3d7a">SESSION 3</text>
    <text x="770" y="216" text-anchor="middle" font-size="13" fill="#0b3d7a">e.g. Codex</text>
    <text x="770" y="246" text-anchor="middle" font-size="12" fill="#1f2328">resumes and finishes</text>
    <text x="770" y="278" text-anchor="middle" font-size="11.5" fill="#57606a">no memory of either</text>
    <text x="770" y="296" text-anchor="middle" font-size="11.5" fill="#57606a">session before it</text>
  </g>

  <!-- commit down, resume up -->
  <line x1="96" y1="316" x2="96" y2="424" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#rdown)"/>
  <line x1="406" y1="424" x2="406" y2="316" stroke="#1baf7a" stroke-width="1.8" marker-end="url(#rup)"/>
  <line x1="516" y1="316" x2="516" y2="424" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#rdown)"/>
  <line x1="716" y1="424" x2="716" y2="316" stroke="#1baf7a" stroke-width="1.8" marker-end="url(#rup)"/>
  <line x1="826" y1="316" x2="826" y2="424" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#rdown)"/>
  <text x="108" y="360" font-size="11.5" fill="#2a78d6">commit:</text>
  <text x="108" y="376" font-size="11.5" fill="#2a78d6">work + ledger line</text>
  <text x="394" y="360" font-size="11.5" fill="#1baf7a" text-anchor="end">resume</text>
  <text x="394" y="376" font-size="11.5" fill="#1baf7a" text-anchor="end">ritual</text>
  <text x="528" y="360" font-size="11.5" fill="#2a78d6">commit</text>
  <text x="704" y="360" font-size="11.5" fill="#1baf7a" text-anchor="end">resume</text>
  <text x="704" y="376" font-size="11.5" fill="#1baf7a" text-anchor="end">ritual</text>
  <text x="838" y="360" font-size="11.5" fill="#2a78d6">commit</text>

  <!-- the repository -->
  <rect x="20" y="424" width="880" height="98" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="2"/>
  <text x="460" y="454" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1f2328">the repository, the only store that outlives every session</text>
  <text x="460" y="480" text-anchor="middle" font-size="13.5" fill="#1f2328">code, and beside it LEDGER.md</text>
  <text x="460" y="504" text-anchor="middle" font-size="12" fill="#57606a">what remains next  ·  the machine setup as runnable commands  ·  newest-first history, each entry naming the platform and model that wrote it</text>

  <!-- legend -->
  <rect x="20" y="540" width="880" height="64" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <line x1="42" y1="562" x2="86" y2="562" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#rdown)"/>
  <text x="98" y="566" font-size="12.5" fill="#1f2328">a commit that changes anything else carries the ledger too, or follows one that did, and a hook enforces it</text>
  <line x1="42" y1="588" x2="86" y2="588" stroke="#1baf7a" stroke-width="1.8" marker-end="url(#rup)"/>
  <text x="98" y="592" font-size="12.5" fill="#1f2328">one paragraph pasted into any cold session on any platform rebuilds the environment and restarts the work</text>
</svg>
